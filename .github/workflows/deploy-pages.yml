# 2026-11-05 23:29 KST
# main 브랜치에 올릴 때마다 GitHub Pages 로 자동 배포한다.
# Pages 는 화면 파일만 올리므로, AI 판별은 Vercel 에 올린 서버 함수(api/index.js)가 맡는다.
# 그 주소는 저장소 설정 → Secrets and variables → Actions → Variables 의 API_BASE_URL 에 넣는다.
# 비어 있으면 앱은 시연 모드(예시 팝업)로 동작한다.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 빌드 (저장소 이름 아래 하위 주소로)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
